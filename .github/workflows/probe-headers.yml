name: Probe wlroots headers

on:
  push:
    branches: [claude/youthful-dijkstra-y410xp]
    paths: ['.github/workflows/probe-headers.yml']

jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            package: libwlroots-0.18-dev
          - image: ubuntu:26.04
            package: libwlroots-0.19-dev
    container: ${{ matrix.image }}
    steps:
      - name: Print headers
        shell: bash
        run: |
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends ${{ matrix.package }} >/dev/null
          dir=$(dirname "$(find /usr/include -name wlr_xdg_shell.h | head -1)")
          echo "headers in $dir"
          ls "$dir"
          for h in wlr_xdg_foreign_v1.h wlr_xdg_foreign_v2.h wlr_xdg_foreign_registry.h \
                   wlr_security_context_v1.h wlr_content_type_v1.h wlr_tearing_control_v1.h \
                   wlr_output_power_management_v1.h wlr_xdg_dialog_v1.h wlr_xdg_system_bell_v1.h \
                   wlr_ext_foreign_toplevel_list_v1.h wlr_alpha_modifier_v1.h \
                   wlr_xdg_toplevel_icon_v1.h wlr_transient_seat_v1.h; do
            echo "===== $h"
            if [[ -f $dir/$h ]]; then
              grep -nE '#include|_create\(|struct wl_signal|^struct|^\s+(int|uint|bool|enum|char|struct|const)' "$dir/$h" | head -80
            else
              echo "(missing)"
            fi
          done
          echo "===== show_window_menu event"
          grep -n -A8 "struct wlr_xdg_toplevel_show_window_menu_event" "$dir/wlr_xdg_shell.h"
          echo "===== set_global_filter"
          grep -rn "wl_display_set_global_filter\|wl_global_get_interface" /usr/include/wayland-server-core.h || true
