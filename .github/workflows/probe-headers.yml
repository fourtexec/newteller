# Temporary: prints wlroots headers so the compositor code can match them.
name: Probe wlroots headers
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-headers.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: debian:13
            pkg: libwlroots-0.18-dev
          - image: ubuntu:26.04
            pkg: libwlroots-0.19-dev
    container: ${{ matrix.image }}
    steps:
      - run: |
          apt-get update >/dev/null
          apt-get install -y --no-install-recommends ${{ matrix.pkg }} libcairo2-dev libpango1.0-dev wayland-protocols >/dev/null
          inc=$(find /usr/include -maxdepth 2 -type d -name 'wlroots-0.1*' | head -1)
          echo "INCLUDE=$inc"
          show() { echo "=================== $1"; grep -v '^ \*\|^/\*\*\|^\s*$\|^ \*/' "$inc/wlr/$1" | head -${2:-200}; }
          show types/wlr_xdg_decoration_v1.h 80
          show types/wlr_buffer.h 160
          show render/wlr_texture.h 120
          show types/wlr_compositor.h 400 | grep -n "texture\|struct wlr_surface {\|current;\|buffer\|wlr_surface_for_each\|get_texture"
          echo "=================== scene funcs"
          grep -n "^struct wlr_scene_buffer \*\|^void wlr_scene_buffer\|wlr_scene_node_at\|wlr_scene_buffer_from_node\|wlr_scene_surface_try_from\|^bool wlr_scene_output_build_state\|wlr_scene_tree_from_node\|wlr_scene_node_for_each_buffer" "$inc/wlr/types/wlr_scene.h"
          echo "=================== xwayland decorations"
          grep -n "decorations\|DECORATIONS" "$inc/wlr/xwayland/xwayland.h"
          grep -n "set_decorations\|request_" "$inc/wlr/xwayland/xwayland.h" | head -30
          echo "=================== renderer"
          grep -n "^struct wlr_render_pass \*\|^bool wlr_render_pass_submit\|^void wlr_render_pass_add_texture\|struct wlr_render_texture_options {" -A3 "$inc/wlr/render/wlr_renderer.h" "$inc/wlr/render/pass.h" 2>/dev/null | head -60
          grep -n "wlr_allocator_create_buffer" "$inc/wlr/render/allocator.h"
          echo "=================== protocols"
          ls /usr/share/wayland-protocols/unstable/xdg-decoration/ /usr/share/wayland-protocols/stable/ 
          pkg-config --modversion cairo pangocairo
