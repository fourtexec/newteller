name: Build and release NewTeller

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newteller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # Debian 12 / Ubuntu 24.04 ship Qt5 LayerShellQt; this project needs Qt6.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            target: debian13-x86_64
          - image: ubuntu:26.04
            target: ubuntu26.04-x86_64
    container: ${{ matrix.image }}
    timeout-minutes: 40
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: bash scripts/install-build-deps.sh
      - name: Rust tests
        run: |
          cd rust
          cargo test --workspace
      # The shell must parse on every Qt version the artifacts run on. The
      # newest PySide6 passes syntax that older parsers reject (Qt 6.8 still
      # reserves the ES3 words), so the smoke test also runs on 6.8 — the Qt
      # Debian 13 installs at runtime.
      - name: QML smoke test (newest Qt)
        run: |
          python3 -m venv /tmp/newteller-venv
          /tmp/newteller-venv/bin/pip install PySide6-Essentials
          /tmp/newteller-venv/bin/python tests/qml_smoke.py
      - name: QML smoke test (Qt 6.8 parser)
        shell: bash
        run: |
          minor=$(python3 -c 'import sys; print(sys.version_info[1])')
          if [ "$minor" -gt 13 ]; then
            echo "PySide6 6.8 has no wheels for this Python; skipping the old-parser leg."
            exit 0
          fi
          python3 -m venv /tmp/newteller-venv-qt68
          /tmp/newteller-venv-qt68/bin/pip install 'PySide6-Essentials>=6.8,<6.9'
          /tmp/newteller-venv-qt68/bin/python tests/qml_smoke.py
      - name: Build and package
        run: bash scripts/build-release.sh "$GITHUB_SHA"
      - name: Preserve release archive
        uses: actions/upload-artifact@v4
        with:
          name: newteller-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish commit release
    needs: build
    # Never publish from PRs or manual runs on non-main branches.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: newteller-*-x86_64
          merge-multiple: true
          path: release-assets
      - name: Create release and attach ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="commit-${COMMIT_SHA}"
          cat > release-notes.md <<EOF_NOTES
          Automated build of commit ${COMMIT_SHA}.

          Targets: Debian 13 (trixie) and Ubuntu 26.04 LTS, Linux x86_64.
          Download the archive matching your distribution.
          Extract the ZIP and run \`sudo bash install.sh\` from the extracted directory.
          The installer installs system Qt6 / LayerShellQt runtime dependencies.
          QML and built-in themes are embedded in the executable; example plugins and desktop entries are included.
          The archive is not a statically linked or cross-distribution portable build.
          EOF_NOTES
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT_SHA" \
              --title "commit ${COMMIT_SHA}" --notes-file release-notes.md \
              --prerelease --latest=false
          fi
          # A rerun replaces assets instead of failing on an existing release.
          gh release upload "$tag" release-assets/*.zip release-assets/*.sha256 --clobber
