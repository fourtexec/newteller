# xdg-desktop-portal backends for the NewTeller session (XDG_CURRENT_DESKTOP=NewTeller).
# Screen sharing and screenshots go through the wlroots portal (the compositor
# implements wlr-screencopy); file choosers, settings and the rest use GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
