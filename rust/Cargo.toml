# Rust half of NewTeller.
#
# `newteller-core` is compiled twice: as an rlib (used by the CLI and the tests)
# and as a C static library that the Qt shell links against through src/rustbridge.cpp.
# The CMake build drives `cargo build` for both crates, see the top-level CMakeLists.txt.

[workspace]
resolver = "2"
members = ["crates/newteller-core", "crates/newteller-ctl"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/fourtexec/newteller"
authors = ["NewTeller contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rayon = "1"
newteller-core = { path = "crates/newteller-core", version = "0.3.0" }

# The shell links this archive statically, so favour a small, fast, position
# independent build. Panics must keep unwinding: every `extern "C"` entry point
# runs inside `catch_unwind` and turns a panic into an error instead of
# unwinding through C++ frames (which would be undefined behaviour).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = false

[profile.release-debug]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 1
