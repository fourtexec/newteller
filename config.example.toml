# NewTeller configuration example.
# Copy to ~/.config/newteller/config.toml and edit. Every key is optional.

[theme]
panel_background = "rgba(24, 26, 32, 0.92)"
panel_foreground = "#f2f4f8"
accent = "#2f80ed"
font = "Cantarell 10"
radius = 8
# custom_css = "~/.config/newteller/custom.css"   # applied on top of the built-in theme

[panel]
position = "bottom"        # bottom | top | left | right
height = 48
show_clock = true
clock_format = "%H:%M\n%d.%m.%Y"
centered = false           # true = Windows 11 style centered taskbar

[start_menu]
width = 420
height = 560
recent_count = 8

[icons]
# Path to a checkout of https://github.com/fourtexec/iconkit
path = "~/iconkit/icons"
set = "lucide"
size = 24

[[pinned]]
name = "Terminal"
command = "x-terminal-emulator"
icon = "terminal"

[[pinned]]
name = "Files"
command = "xdg-open ~"
icon = "folder"

[[pinned]]
name = "Browser"
command = "x-www-browser"
icon = "globe"
